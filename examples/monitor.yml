name: Monitor EU Careers FG III

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check for new vacancies
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python eu_jobs_monitor.py
      - name: Save state
        run: |
          if [ -n "$(git status --porcelain seen.json)" ]; then
            git config user.name "eu-jobs-bot"
            git config user.email "eu-jobs-bot@users.noreply.github.com"
            git add seen.json
            git commit -m "Update seen.json"
            git pull --rebase -X theirs
            git push
          fi
